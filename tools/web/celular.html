<title>Ninguém Sobe a Rampa</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a0d05">
<style>
  /* palco do jogo em tela toda, area segura do celular respeitada; um visual so (o do jogo), escuro */
  :root {
    --chao: #1a0d05;      /* fundo atras do jogo (o mesmo do canvas) */
    --madeira: #3a2414;
    --creme: #f6e7c8;
    --folha: #8cc46a;
    --brasa: #f0a254;
    --sombra: rgba(26, 13, 5, 0.74);
    --f-titulo: "Copperplate", "Rockwell", Georgia, serif;
    --f-texto: "Avenir Next", Avenir, "Trebuchet MS", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--chao); color: var(--creme); }
  body { margin: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  #palco {
    position: fixed;
    top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px);
    left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px);
  }
  #game { display: block; touch-action: none; }

  #telaCheia {
    position: fixed; z-index: 5; width: 44px; height: 44px; padding: 0;
    display: grid; place-items: center; cursor: pointer;
    border-radius: 50%; border: 2px solid rgba(246, 231, 200, 0.55);
    background: var(--sombra); color: var(--creme);
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
  }
  #telaCheia:focus-visible { outline: 3px solid var(--brasa); outline-offset: 2px; }
  #telaCheia svg { width: 22px; height: 22px; }

  #girar {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-content: center; justify-items: center; gap: 18px; text-align: center;
    padding-block: 24px;
    padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
    background: radial-gradient(120% 80% at 50% 30%, #2c3a1c 0%, var(--chao) 70%);
  }
  #girar .fone {
    width: 46px; height: 80px; border: 3px solid var(--creme); border-radius: 10px; position: relative;
    animation: deita 2.4s ease-in-out infinite;
  }
  #girar .fone::after {
    content: ""; position: absolute; left: 50%; bottom: 6px; width: 14px; height: 3px; margin-left: -7px;
    border-radius: 2px; background: var(--creme); opacity: 0.6;
  }
  #girar h1 { margin: 0; font: 700 26px/1.15 var(--f-titulo); letter-spacing: 0.04em; color: var(--creme); text-wrap: balance; }
  #girar p { margin: 0; max-width: 30ch; font: 500 15px/1.45 var(--f-texto); color: rgba(246, 231, 200, 0.78); }
  #girar b { color: var(--folha); font-weight: 600; }
  @keyframes deita { 0%, 25% { transform: rotate(0deg); } 55%, 85% { transform: rotate(-90deg); } 100% { transform: rotate(0deg); } }
  @media (prefers-reduced-motion: reduce) { #girar .fone { animation: none; transform: rotate(-90deg); } }
</style>

<div id="palco"><canvas id="game"></canvas></div>

<button id="telaCheia" type="button" aria-label="Tela cheia" title="Tela cheia" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
  </svg>
</button>

<div id="girar" hidden>
  <div class="fone" aria-hidden="true"></div>
  <h1>Gire o celular</h1>
  <p>A mata se defende com o celular <b>deitado</b>.</p>
</div>

<script>window.MOB_ORIG = __ORIG__;</script>
